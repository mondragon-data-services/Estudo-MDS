[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mds-comum"
version = "0.1.0"
description = "Código compartilhado pelas aulas da Mondragon Data Services (conexão com o SQL Server, .env)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Bruno Vieira" }]
dependencies = [
    "pyodbc>=5.1",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
