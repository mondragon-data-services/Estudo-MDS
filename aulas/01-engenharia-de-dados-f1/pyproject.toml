[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-pipeline"
version = "1.0.0"
description = "Projeto didático de Engenharia de Dados: ingestão, processamento e analytics com dados da Fórmula 1"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bruno Vieira" }]
keywords = ["data-engineering", "great-expectations", "streamlit", "formula1", "ensino"]

dependencies = [
    "requests>=2.31,<3",
    "tenacity>=8.2,<10",
    "pandas>=2.1,<3",
    "pyarrow>=15",
    "numpy>=1.26,<3",
    "great-expectations>=1.3,<2",
    "streamlit>=1.49",
    "plotly>=5.20",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4.0", "ipykernel>=6.29", "nbformat>=5.9"]
dev = ["pytest>=8.0"]

[project.scripts]
f1-pipeline = "f1_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
